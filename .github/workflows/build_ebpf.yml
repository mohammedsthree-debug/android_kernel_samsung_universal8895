name: Build S8+ eBPF Kernel

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to build (default: exact device commit 8d79a2d)'
        required: true
        default: '8d79a2d98eeb0100f890121dd5893b5d2e0b8d9c'
  push:
    paths:
      - '.github/workflows/build_ebpf.yml'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4

      - name: Fetch and Switch to Exact Device Commit
        run: |
          TARGET_SHA="${{ github.event.inputs.commit_sha || '8d79a2d98eeb0100f890121dd5893b5d2e0b8d9c' }}"
          echo "Fetching target SHA $TARGET_SHA from upstream repository..."
          git remote add upstream https://github.com/8890q/android_kernel_samsung_universal8895.git || true
          git fetch --depth=1 upstream $TARGET_SHA
          git checkout FETCH_HEAD
          echo "HEAD is now verified at:"
          git log -1 --oneline

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            zip \
            unzip \
            curl \
            cpio \
            python-is-python3 \
            lib32z1 \
            libc6-i386

      - name: Patch Source for Modern GCC Compatibility
        run: |
          echo "=== Phase 1: Fix DTC yylloc multiple definition ==="
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true

          echo "=== Phase 2: Add -fcommon to host build flags ==="
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /g' Makefile || true
          sed -i 's/HOSTCFLAGS   =/HOSTCFLAGS   = -fcommon /g' Makefile || true

          echo "=== Phase 3: Strip -Werror globally ==="
          # Remove -Werror from root Makefile line 406
          sed -i '/^[[:space:]]*-Werror[[:space:]]*\\\\$/d' Makefile || true
          sed -i 's/[[:space:]]\+-Werror[[:space:]]*/ /g' Makefile || true
          # Remove from all sub-Makefiles and Kbuild files
          find . -path ./toolchain-\* -prune -o \( -name Makefile -o -name Kbuild \) -print | xargs sed -i 's/-Werror / /g; s/-Werror$//g' || true

          echo "=== Phase 4: Fix floating-point in kernel decon_reg.c ==="
          # Samsung BSP uses 'const double' table in decon_reg.c which triggers
          # '-mgeneral-regs-only and floating point code' error.
          # Allow FP for that specific file only.
          echo 'CFLAGS_decon_reg.o += -mno-general-regs-only' >> drivers/video/fbdev/exynos/dpu/Makefile

          echo "=== Phase 5: Fix displayport_drv.c uninitialized variable ==="
          # Initialize training_aux_rd_interval to 0 to silence -Wuninitialized
          sed -i 's/training_aux_rd_interval;/training_aux_rd_interval = 0;/g' drivers/video/fbdev/exynos/dpu/displayport_drv.c || true

          echo "=== All patches applied ==="

      - name: Download Official LineageOS GCC 4.9 Toolchains
        run: |
          echo "Cloning LineageOS aarch64 toolchain..."
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain-aarch64
          echo "Cloning LineageOS arm32 toolchain..."
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain-arm
          echo "$GITHUB_WORKSPACE/toolchain-aarch64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchain-arm/bin" >> $GITHUB_PATH

      - name: Configure Kernel with eBPF & Uprobes
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          make exynos8895-dream2lte_defconfig

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_HAVE_BPF_JIT
          ./scripts/config --enable CONFIG_BPF_EVENTS
          ./scripts/config --enable CONFIG_UPROBES
          ./scripts/config --enable CONFIG_UPROBE_EVENTS
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --enable CONFIG_DYNAMIC_FTRACE
          ./scripts/config --enable CONFIG_FUNCTION_TRACER
          ./scripts/config --enable CONFIG_PERF_EVENTS
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --enable CONFIG_NET_CLS_BPF
          ./scripts/config --enable CONFIG_NET_ACT_BPF
          ./scripts/config --disable CONFIG_BPF_UNPRIV_DEFAULT_OFF

          make olddefconfig

          echo "=== Verified Target Kernel Flags ==="
          grep -E "CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_UPROBES|CONFIG_UPROBE_EVENTS|CONFIG_KPROBES" .config

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          make -j$(nproc --all) KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          sed -i 's/device.name1=.*/device.name1=dream2lte/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=dreamlte/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=greatlte/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/.*|block=/dev/block/by-name/BOOT;|g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=0/g' AnyKernel3/anykernel.sh

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image AnyKernel3/Image
          fi

          cd AnyKernel3
          zip -r9 ../dream2lte-ebpf-uprobes-kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-ebpf-uprobes-kernel
          path: dream2lte-ebpf-uprobes-kernel.zip
